name: Lighthouse

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Build deterministic production output
        run: pnpm build:ci

      - name: Audit production output
        run: pnpm exec lhci autorun

      - name: Write Lighthouse summary
        if: always()
        env:
          LIGHTHOUSE_SUMMARY: ${{ runner.temp }}/lighthouse-summary.md
        run: |
          pnpm lighthouse:summary > "$LIGHTHOUSE_SUMMARY"
          cat "$LIGHTHOUSE_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .lighthouseci
          cp "$LIGHTHOUSE_SUMMARY" .lighthouseci/lighthouse-summary.md

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports-pr-${{ github.event.pull_request.number }}
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Lighthouse PR summary
    needs: audit
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download Lighthouse summary
        uses: actions/download-artifact@v7
        with:
          name: lighthouse-reports-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/lighthouse-reports

      - name: Locate Lighthouse summary
        id: summary
        run: |
          summary_path=$(find "${{ runner.temp }}/lighthouse-reports" -name lighthouse-summary.md -type f -print -quit)
          test -n "$summary_path"
          echo "path=$summary_path" >> "$GITHUB_OUTPUT"

      - name: Update Lighthouse PR summary
        uses: actions/github-script@v8
        env:
          LIGHTHOUSE_SUMMARY: ${{ steps.summary.outputs.path }}
          LIGHTHOUSE_MARKER: <!-- lighthouse-ci-summary -->
          LIGHTHOUSE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = process.env.LIGHTHOUSE_MARKER;
            const summary = fs.readFileSync(process.env.LIGHTHOUSE_SUMMARY, "utf8").trim();
            const body = [
              marker,
              summary,
              "",
              `[상세 실행 로그 및 Artifact](${process.env.LIGHTHOUSE_RUN_URL})`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
